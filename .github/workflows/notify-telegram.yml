name: 텔레그램 알림

# 보완 PR 이 열리면 "검토 대기", main 에 머지되면 "반영됨"을 텔레그램으로 보낸다.
# 시크릿(TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)이 없으면 조용히 건너뛴다.
# 수동 실행(workflow_dispatch)은 연결 확인용 시험 메시지를 보낸다.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 알림 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python .github/scripts/notify_telegram.py --test
          else
            python .github/scripts/notify_telegram.py
          fi
