name: 검증 (PR·작업 브랜치)

# main 이 아닌 브랜치에 push 하면 돈다. main 은 매시 데이터 봇이 커밋하므로
# 여기서 제외한다(배포는 etl.yml 담당). 이 워크플로는 읽기 전용이다:
# 데이터를 커밋하지도, 사이트를 배포하지도 않는다.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 표준 라이브러리만 쓰므로 설치할 것이 없다.
      - name: 단위 테스트
        run: python -m unittest discover -s tests -v

      # 감시목록(원화·엔화 스테이블코인) 종목이 원본 API 에 어떤 id·pegType 으로
      # 들어 있는지 로그로 남긴다. 외부 API 장애로 PR 이 빨개지지 않도록 실패를 허용한다.
      - name: 감시목록 원본 확인 (읽기 전용)
        run: python etl/fetch.py --probe-watchlist
        continue-on-error: true

      # 실제 원본으로 스냅숏을 임시 폴더에 만들어 보고 요약(시스템 등급·위험점수·
      # 경보 종목·시장 영향 종목)만 로그로 남긴다. 저장소에는 아무것도 쓰지 않는다.
      # 산출 방식 변경이 실데이터에서 어떤 결과를 내는지 PR 단계에서 확인하려는 것.
      - name: 스냅숏 시험 생성 (읽기 전용, 결과는 임시 폴더)
        run: python etl/fetch.py --out "$RUNNER_TEMP/scw-dryrun"
        continue-on-error: true

      # 국내 원화마켓 USDT·USDC 일별 거래대금(업비트·빗썸·코인원·디지털엑스·고팍스) 응답 확인(쓰기 없음).
      - name: 국내 원화마켓 스테이블코인 거래대금 확인 (읽기 전용)
        run: python etl/fetch_krw_volume.py --probe
        continue-on-error: true

      # 발행사 동결 조치(이더리움 계열·트론·솔라나)를 임시 폴더로 시험 수집한다(저장소 쓰기 없음).
      # 솔라나는 거래를 하나씩 열어야 해 10분 넘게 걸린다(2026-10-08 실측 11분 — 검증 전체 시간의 대부분).
      # 그래서 동결 수집 코드가 바뀐 브랜치에서만 돌린다. 수동 실행(workflow_dispatch)은 항상 돈다.
      - name: 동결 수집 코드 변경 여부
        id: changed
        run: |
          git fetch --quiet --depth=1 origin main
          if git diff --name-only FETCH_HEAD HEAD | grep -qE '^etl/(fetch_freeze|freeze_)'; then
            echo "freeze=true" >> "$GITHUB_OUTPUT"
            echo "동결 수집 코드 변경 있음 → 시험 수집 실행"
          else
            echo "동결 수집 코드 변경 없음 → 시험 수집 건너뜀"
          fi
        continue-on-error: true

      - name: 동결 조치 다중 체인 시험 수집 (읽기 전용)
        if: steps.changed.outputs.freeze == 'true' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 15
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python etl/fetch_freeze.py --days 30 --out "$RUNNER_TEMP/scw-dryrun"
        continue-on-error: true

      # 뉴스 RSS 피드별 응답·24시간 건수·키워드 반영 건수를 로그로 남긴다(쓰기 없음).
      - name: 뉴스 피드 확인 (읽기 전용)
        run: python etl/fetch_news.py --probe
        continue-on-error: true

      # 국내 거래소 5곳 공개 마켓 API 응답 형식과 스테이블코인 매칭을 로그로 남긴다(쓰기 없음).
      - name: 국내 거래소 거래지원 확인 (읽기 전용)
        run: python etl/fetch_listings.py --probe
        continue-on-error: true
