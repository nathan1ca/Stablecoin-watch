name: 수집 및 배포

on:
  schedule:
    # GitHub Actions는 짧은 간격 스케줄을 부하 시 지연·스킵하는 경우가 잦다.
    # */15 로는 낮 시간대에 실제로 자주 밀려서 매시 정각("0 * * * *")으로 낮췄으나,
    # 2026-09-25~10-07 실측 예약 실행 60회는 하루 3~6회, 간격 중앙값 약 5시간(최대 9.6시간)이었다.
    # GitHub 문서: "High load times include the start of every hour. ... some queued
    # jobs may be dropped. To decrease the chance of delay, schedule your workflow to
    # run at a different time of the hour." → 정각을 피해 매시 37분으로 옮긴다
    # (2026-10-08). 진짜 1분 단위가 필요하면 etl/live_loop.py 를 로컬/서버에서 돌려라.
    - cron: "37 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 표준 라이브러리만 사용하므로 설치할 의존성이 없다.
      # continue-on-error: 이 단계 하나가 실패해도(외부 API 일시 장애 등)
      # 나머지 모듈 수집과 사이트 배포는 계속 진행된다. 실패한 모듈의
      # data/*.json 은 직전 성공분이 그대로 남아 화면에 표시된다.
      - name: 데이터 수집
        run: python etl/fetch.py
        continue-on-error: true

      # 키 없이 항상 실행된다. 스냅샷(data/snapshot.json)의 종목 목록을 쓰므로 데이터 수집 바로
      # 다음에 둔다 — 국내 원화마켓 거래대금 비중(아래)이 같은 회차의 상장 목록을 쓰게 하려는 것.
      # 데이터 수집(종목별 시계열 범위)은 직전 회차 목록을 쓰므로 새 상장은 다음 회차부터 반영된다.
      # 거래소 하나가 실패해도 나머지는 기록된다.
      - name: 국내 거래소 거래지원 수집
        run: python etl/fetch_listings.py
        continue-on-error: true

      # 발행사 동결·소각: 이더리움 계열(Etherscan V2, ETHERSCAN_API_KEY 필요 — 없으면 이 체인들만
      # 건너뜀)·트론(TronGrid, 키 선택)·솔라나(공개 RPC, 증분 수집 상태는 site/data/freeze_state_solana.json).
      # 솔라나는 회차당 시간 상한(SOLANA_TIME_BUDGET, 기본 150초)까지만 수집하고 다음 회차에 이어 간다.
      # 그래도 멈추면 배포가 막히지 않게 단계 전체를 8분에서 끊는다(2026-10-08: 11분 넘게 걸려 배포 지연).
      - name: 동결 조치 수집
        timeout-minutes: 8
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          TRONGRID_API_KEY: ${{ secrets.TRONGRID_API_KEY }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
        run: python etl/fetch_freeze.py --days 90
        continue-on-error: true

      # 키 없이 항상 실행된다. Binance가 실행 서버(미국 소재) IP를 지역
      # 차단하면(HTTP 451) 스크립트가 자동으로 CoinGecko로 전환한다.
      - name: 김치프리미엄 수집
        run: python etl/fetch_premium.py --days 180
        continue-on-error: true

      # 국경 간 코너 자금흐름(이더리움)은 2026-10-07 중단했다. 공개 지갑 이름표가 실제
      # 입출금 지갑이 아니어서 0건만 나왔다(docs/IMPROVEMENT_LOG.md (7)·(11) 참고).
      # 코드(etl/fetch_flow.py)는 남겨 두었다 — 검증된 지갑 목록이 생기면 되살린다.

      # 국경 간 코너 자금흐름(XRP)도 2026-10-08 중단했다. 거래소 핫월렛 거래가 많아
      # 조회 한도 안에서 몇 시간치만 잡혔고(180일 표시는 오표시), XRP 이체라
      # 스테이블코인 흐름도 아니다. 국내외 자금 이동 압력은 원화 거래대금·김치프리미엄
      # 탭이 대신한다. 코드(etl/fetch_flow_xrp.py)는 남겨 두었다.

      # etl/attestations.json 을 손으로 갱신해야 값이 바뀐다. 계산만 자동화되어 있다.
      - name: 어테스테이션 시차 계산
        run: python etl/fetch_attestation.py
        continue-on-error: true

      # 키 없이 항상 실행된다. 국내 원화마켓 USDT·USDC 일별 거래대금(업비트·빗썸·코인원·디지털엑스·고팍스).
      - name: 국내 원화마켓 스테이블코인 거래대금 수집
        run: python etl/fetch_krw_volume.py
        continue-on-error: true

      # 키 없이 항상 실행된다. 종목·체인별 최근 30일 토큰 이체 건수(Coin Metrics 커뮤니티 API,
      # 이더리움·트론·아발란체). 일 단위 지표라 하루 한 번만 바뀌지만 호출이 14회뿐이라 매시 돈다.
      # USDS·USD1·USDG·RLUSD 는 Coin Metrics 무료 범위 밖이라 이더리움 몫만 Etherscan 로그로 직접 센다
      # (상태: site/data/onchain_eth_state.json, 회차당 120초 상한 — 처음 30일치는 몇 회차에 걸쳐 채움).
      - name: 최근 30일 온체인 이체 건수 수집
        timeout-minutes: 6
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python etl/fetch_onchain_tx.py
        continue-on-error: true

      # 키 없이 항상 실행된다. 최근 24시간 스테이블코인 관련 뉴스·당국 발표의 제목·출처·링크만
      # 공개 RSS 로 모은다(본문·요약 미수집). 피드 목록은 etl/news_feeds.json.
      - name: 최근 24시간 뉴스 헤드라인 수집
        run: python etl/fetch_news.py
        continue-on-error: true

      - name: 갱신분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --staged --quiet || git commit -m "데이터 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
        continue-on-error: true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
