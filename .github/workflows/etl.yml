name: 수집 및 배포

on:
  schedule:
    # GitHub Actions는 5분 미만 스케줄을 지원하지 않고, 부하 시 더 늦게 돌기도
    # 한다. 진짜 1분 단위가 필요하면 etl/live_loop.py 를 로컬/서버에서 계속
    # 돌려라 — 이건 아무도 그걸 안 켜놨을 때의 기준선(15분)이다.
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 표준 라이브러리만 사용하므로 설치할 의존성이 없다.
      - name: 데이터 수집
        run: python etl/fetch.py

      # ETHERSCAN_API_KEY 시크릿이 없으면 이 단계는 조용히 건너뛴다.
      - name: 동결 조치 수집
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python etl/fetch_freeze.py --days 365

      # 키 없이 항상 실행된다.
      - name: 김치프리미엄 수집
        run: python etl/fetch_premium.py --days 180

      # ETHERSCAN_API_KEY 재사용. 없으면 건너뛴다.
      - name: 국경 간 코너 자금흐름 수집 (이더리움)
        env:
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
        run: python etl/fetch_flow.py --days 180

      # 키 없이 항상 실행된다.
      - name: 국경 간 코너 자금흐름 수집 (XRP)
        run: python etl/fetch_flow_xrp.py --days 180

      # etl/attestations.json 을 손으로 갱신해야 값이 바뀐다. 계산만 자동화되어 있다.
      - name: 어테스테이션 시차 계산
        run: python etl/fetch_attestation.py

      - name: 갱신분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          git diff --staged --quiet || git commit -m "데이터 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
        continue-on-error: true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
